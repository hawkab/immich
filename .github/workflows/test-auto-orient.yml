name: Test photo orientation
on:
  pull_request:
    paths:
      - 'misc/auto-orient/**'
      - '.github/workflows/test-auto-orient.yml'
      - 'mise.toml'
  push:
    branches: [main, 'feature/**', 'bugfix/**']
    paths:
      - 'misc/auto-orient/**'
      - '.github/workflows/test-auto-orient.yml'
      - 'mise.toml'
permissions:
  contents: read
jobs:
  orientation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@caac7f7e4298458a14238959504f411fc6cc7f06
        with:
          github_token: ${{ github.token }}
          working_directory: ./misc/auto-orient
      - run: mise //misc/auto-orient:install
      - run: mise //misc/auto-orient:lint
      - run: mise //misc/auto-orient:check
      - run: mise //misc/auto-orient:test
